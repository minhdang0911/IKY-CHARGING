// cấu hình de build 2 app cung luc file apk tren anhdroid dùng ./gradlew assembleRelease rồi adb install -r app/build/outputs/apk/release/app-universal-release.apk
// cách build anhdroid
// Bước 1 : cd android
// Bước 2: ./gradlew assembleRelease
// Bước 3: adb install -r app/build/outputs/apk/release/app

// debug
// npx react-native start --reset-cache
// cd android -> .\gradlew clean
// cd.. -> npx react-native run-android

// ./gradlew bundleRelease -> build aab


plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
    // id "com.google.gms.google-services" // nếu dùng FCM hãy bật lại
}

react { /* giữ mặc định */ }

// 💡 Nếu không cần 32-bit, bỏ hẳn cho nhẹ & tránh .so cũ
def ENABLE_32_BIT = false

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "com.ikycharging"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.ikycharging"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7        // 🔼 nhớ tăng
        versionName "1.3.4"  // 🔼 nhớ tăng
        multiDexEnabled true

        // react-native-camera legacy
        missingDimensionStrategy 'react-native-camera', 'general'

        // 🧪 (tuỳ chọn) Cho native build biết hỗ trợ page size linh hoạt
        // Với NDK r28+ thường không cần, nhưng thêm cũng vô hại:
        externalNativeBuild {
            cmake {
                // Nếu project có CMake, thêm flags link 16KB cho lib tự build:
                // cppFlags "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=1"
                // arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (project.hasProperty("MYAPP_UPLOAD_STORE_FILE")) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // ✅ Chỉ build 64-bit để né .so 32-bit lỗi thời (khuyến nghị)
    splits {
        abi {
            enable true
            reset()
            if (ENABLE_32_BIT) {
                include "armeabi-v7a","arm64-v8a","x86","x86_64"
            } else {
                include "arm64-v8a","x86_64"
            }
            universalApk true
        }
    }

    // AAB/APK không nhúng dependency info
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    // 🧹 (tuỳ chọn) loại bỏ lib 32-bit nếu lib thứ ba vẫn kéo vào
   packagingOptions {
    jniLibs {
        excludes += ["**/armeabi/**", "**/armeabi-v7a/**", "**/x86/**"]
    }
}
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core:1.12.0")
    implementation("androidx.core:core-ktx:1.12.0")

    implementation("com.google.android.gms:play-services-location:20.0.0")
    // implementation("com.google.firebase:firebase-messaging:23.4.0") // nếu dùng FCM thì bật

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle");
applyNativeModulesAppBuildGradle(project)

